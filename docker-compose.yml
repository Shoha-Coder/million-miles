services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: million_miles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d million_miles"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/million_miles
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # $$ in compose files = literal $ — bcrypt hash must not be shell-expanded
      ADMIN_PASSWORD_HASH: "$$2b$$12$$ut6d54Hp/Nn35FFpH02l4e8ioGDntsJEyfJRK3wNllCLq2AYiWlyK"
      ADMIN_USERNAME_2: ${ADMIN_USERNAME_2:-}
      ADMIN_PASSWORD_HASH_2: ${ADMIN_PASSWORD_HASH_2:-}
      SCRAPER_PAGES_PER_RUN: ${SCRAPER_PAGES_PER_RUN:-100}
      SCRAPER_REQUEST_DELAY: ${SCRAPER_REQUEST_DELAY:-1.0}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
