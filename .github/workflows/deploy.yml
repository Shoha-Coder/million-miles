name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Run backend test suite ────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: million_miles_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install uv
          # psycopg2-binary for Alembic sync migrations (not needed at runtime)
          uv pip install --system --no-cache ".[dev]" psycopg2-binary

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/million_miles_test
          JWT_SECRET: ci-test-secret-not-used-in-prod
        run: |
          cd backend
          alembic upgrade head

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/million_miles_test
          JWT_SECRET: ci-test-secret-not-used-in-prod
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # ── Deploy to VPS (main branch only) ─────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH → pull → rebuild → restart
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          JWT_SECRET:           ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME:       ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD:       ${{ secrets.ADMIN_PASSWORD }}
          NEXT_PUBLIC_API_URL:  ${{ secrets.NEXT_PUBLIC_API_URL }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          envs:     DB_PASSWORD,JWT_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD,NEXT_PUBLIC_API_URL
          script: |
            set -e

            cd ${{ secrets.VPS_DEPLOY_PATH }}

            git pull origin main

            # Write .env from secrets — printf avoids heredoc escaping issues
            printf '%s\n' \
              "DB_PASSWORD=${DB_PASSWORD}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "ADMIN_USERNAME=${ADMIN_USERNAME}" \
              "ADMIN_PASSWORD=${ADMIN_PASSWORD}" \
              "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
              "SCRAPER_PAGES_PER_RUN=100" \
              "SCRAPER_REQUEST_DELAY=1.0" \
              > .env

            docker compose up --build -d

            # Drop image layers that are no longer referenced
            docker image prune -f
